[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepresearch"
version = "0.1.0"
description = "Multi-Agent Deep Research Agent — handwritten Harness"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    # Data validation
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    # Async HTTP
    "httpx==0.28.1",
    # OpenAI-compatible client
    "openai==1.57.4",
    # Database
    "sqlalchemy[asyncio]==2.0.36",
    "aiomysql==0.2.0",
    "alembic==1.14.0",
    # Redis
    "redis[hiredis]==5.2.1",
    # Vector DB
    "chromadb==0.5.20",
    # Retry / resilience
    "tenacity==9.0.0",
    # Config
    "python-dotenv==1.0.1",
    "pyyaml==6.0.2",
    # SSE streaming
    "sse-starlette==2.1.3",
    # Utilities
    "rich==13.9.4",
    "structlog==24.4.0",
]

[project.optional-dependencies]
langgraph = [
    "langchain==0.3.13",
    "langchain-openai==0.2.14",
    "langgraph==0.2.60",
]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-httpx==0.35.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["deepresearch*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
